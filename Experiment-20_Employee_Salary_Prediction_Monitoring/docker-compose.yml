# Employee Salary Prediction - full MLOps stack
#   python train_mlflow.py            (creates model/ and mlflow.db first)
#   docker compose up -d --build
#   API http://localhost:5000 | MLflow http://localhost:5001 | Prometheus http://localhost:9090 | Grafana http://localhost:3000 (admin/admin)
services:
  salary-api:
    build: .
    ports: ["5000:5000"]
    volumes: ["./logs:/app/logs"]
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    command: mlflow ui --backend-store-uri sqlite:////mlflow/mlflow.db --host 0.0.0.0 --port 5001
    ports: ["5001:5001"]
    volumes: ["./mlflow.db:/mlflow/mlflow.db", "./mlruns:/mlruns"]
  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    environment: [GF_SECURITY_ADMIN_PASSWORD=admin]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
