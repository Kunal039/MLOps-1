groups:
  - name: salary-model
    rules:
      - alert: PredictedSalaryShift
        expr: (sum(rate(salary_predicted_lpa_sum[30m])) / sum(rate(salary_predicted_lpa_count[30m]))) > 20
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Average predicted salary moved above 20 LPA - possible data drift, run monitor_drift.py"
      - alert: HighValidationErrors
        expr: sum(rate(salary_validation_errors_total[5m])) > 0.2
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Many invalid requests - check the client integration"
      - alert: SlowPredictions
        expr: histogram_quantile(0.95, sum(rate(salary_request_latency_seconds_bucket[5m])) by (le)) > 0.3
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "p95 latency above 300 ms"
